# Render blueprint for the Express API.
#
# In the Render dashboard: New > Blueprint > point it at this repository.
# MONGODB_URI, JWT_SECRET and FRONTEND_URL are marked sync:false, so Render
# prompts for them instead of reading them from this file - secrets never
# belong in version control.
services:
  - type: web
    name: ai-finance-tracker-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: PORT
        value: 5000
      - key: JWT_EXPIRE
        value: 7d
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Set these in the Render dashboard when prompted:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Must be the exact deployed frontend origin, no trailing slash,
      # e.g. https://ai-finance-tracker.vercel.app
      - key: FRONTEND_URL
        sync: false
      # Optional. Leave unset to run on the heuristic engine.
      - key: OPENAI_API_KEY
        sync: false
